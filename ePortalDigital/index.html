<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">

<title>e-Portal Digital | Puskesmas Girimulyo II</title>

<meta name="theme-color" content="#166534">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal Girimulyo II">

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:#052e16;
}

body{position:fixed;inset:0}

.iframe-container{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  background:#fff;
  overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

iframe{
  position:absolute;
  top:env(safe-area-inset-top,0px);
  left:0;
  right:0;
  bottom:env(safe-area-inset-bottom,0px);
  width:100%;
  height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  border:none;
  background:#fff;
  display:block;
}

.loader-screen{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:22px;
  padding:24px;
  background:
    radial-gradient(800px 500px at 15% 5%,rgba(249,115,22,.18),transparent 55%),
    radial-gradient(800px 500px at 85% 0%,rgba(34,197,94,.22),transparent 55%),
    linear-gradient(155deg,#052e16 0%,#14532d 55%,#166534 100%);
  z-index:9999;
  transition:opacity .35s ease,visibility .35s ease;
}

.logo-mark{
  width:78px;
  height:78px;
  border-radius:24px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#16a34a,#f97316);
  box-shadow:0 14px 38px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.28);
  animation:breathe 2.4s ease-in-out infinite;
}

.logo-mark svg{width:40px;height:40px;fill:#fff}

@keyframes breathe{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06)}
}

.brand{text-align:center}

.brand h1{
  font-family:'Sora',sans-serif;
  font-size:1.55rem;
  font-weight:800;
  color:#fff;
  letter-spacing:-.02em;
}

.brand p{
  margin-top:7px;
  font-size:.76rem;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#bbf7d0;
}

.progress{
  width:190px;
  height:4px;
  border-radius:99px;
  overflow:hidden;
  background:rgba(255,255,255,.14);
}

.progress-bar{
  width:40%;
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#22c55e,#fb923c);
  animation:slide 1.1s ease-in-out infinite;
}

@keyframes slide{
  0%{transform:translateX(-120%)}
  100%{transform:translateX(420%)}
}

.loader-hint{
  font-size:.72rem;
  color:#d1fae5;
  opacity:0;
  transition:opacity .5s ease;
  text-align:center;
}

.loader-hint.show{opacity:.85}
.fade-out{opacity:0;visibility:hidden;pointer-events:none}

.back-home{
  position:fixed;
  right:calc(16px + env(safe-area-inset-right,0px));
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:50px;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  background:linear-gradient(135deg,rgba(20,83,45,.95),rgba(21,128,61,.95));
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;
  text-decoration:none;
  z-index:99999;
  box-shadow:0 10px 28px rgba(5,46,22,.34);
  transition:transform .25s ease,box-shadow .25s ease;
  cursor:pointer;
}

.back-home::after{
  content:"";
  position:absolute;
  right:-2px;
  top:-2px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#f97316;
  border:3px solid #fff;
}

.back-home svg{width:21px;height:21px;fill:#fff}

.back-home:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 32px rgba(5,46,22,.42);
}

@media(max-width:600px){
  .back-home{
    right:calc(14px + env(safe-area-inset-right,0px));
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    width:46px;
    height:46px;
    border-radius:16px;
  }
}
</style>
</head>

<body>

<div class="iframe-container">

  <div class="loader-screen" id="loader">

    <div class="logo-mark">
      <svg viewBox="0 0 24 24">
        <path d="M10 3h4a1 1 0 0 1 1 1v5h5a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-5v5a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-5H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h5V4a1 1 0 0 1 1-1z"/>
      </svg>
    </div>

    <div class="brand">
      <h1>e-Portal Digital</h1>
      <p>Puskesmas Girimulyo II</p>
    </div>

    <div class="progress"><div class="progress-bar"></div></div>

    <div class="loader-hint" id="loaderHint">
      Menyiapkan layanan digital Puskesmas Girimulyo II...
    </div>

  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbylEdH-PxiG4F3dXiOoJEq0AmOGE8tdVKgiSkIrpepR2TmfzBXSh2f1FATJRqyLHbaK/exec"
    allow="geolocation *; camera *; microphone *; clipboard-write *; fullscreen *"
    sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-forms allow-modals allow-downloads"
    loading="eager"
    referrerpolicy="no-referrer"
    allowfullscreen
    onload="hideLoader()">
  </iframe>

</div>

<a
  href="https://puskesmasgirimulyo2.github.io/portal-digital/"
  class="back-home"
  id="backHomeBtn"
  title="Kembali ke Portal Digital"
  aria-label="Kembali ke Portal Digital">
  <svg viewBox="0 0 24 24">
    <path d="M12 3.1 2.6 11a1 1 0 0 0 .64 1.77H5v7.13a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-7.13h1.76A1 1 0 0 0 21.4 11L12 3.1z"/>
  </svg>
</a>

<script>
var loaderHidden = false;

function hideLoader(){
  if(loaderHidden) return;
  loaderHidden = true;
  document.getElementById('loader').classList.add('fade-out');
}

setTimeout(function(){
  if(!loaderHidden){
    document.getElementById('loaderHint').classList.add('show');
  }
},5000);

setTimeout(hideLoader,15000);

document.getElementById('backHomeBtn').addEventListener('click',function(e){
  e.preventDefault();

  var fallbackUrl = this.href;

  var isStandalone =
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
    window.navigator.standalone === true;

  if(window.opener && !isStandalone){
    try{window.close();}catch(err){}
  }

  location.href = fallbackUrl;
});

window.addEventListener('message',function(ev){
  var d = ev.data;
  if(!d || typeof d !== 'object') return;

  var okOrigin = /https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/i.test(ev.origin || '');
  if(!okOrigin) return;

  if(d.type === 'portal-shell-ping'){
    try{ev.source.postMessage({type:'portal-shell-pong'},'*');}catch(e){}
    return;
  }

  if(d.type === 'portal-open-url'){
    var url = String(d.url || '').trim();
    if(!/^https?:\/\//i.test(url)) return;

    var a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.style.display = 'none';

    document.body.appendChild(a);
    a.click();

    setTimeout(function(){
      a.remove();
    },100);
  }
});
</script>

</body>
</html>
